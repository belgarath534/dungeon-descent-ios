# App Store screenshots of Dungeon Descent Chat on an iPhone 6.9" and an
# iPad 13" simulator. The app runs against the local Firebase emulators,
# filled with sample players and messages (tools/chat-screenshot-seed.mjs),
# so no real player's data is ever in a screenshot. The pictures go to the
# chat-screenshots-results branch; with "upload" (or the
# chat-screenshots-upload branch) they also replace the App Store ones.
name: Chat app screenshots

on:
  push:
    # chat-submit: take, upload, fill in the store page and send 1.0 to App Review.
    branches: [chat-screenshots, chat-screenshots-upload, chat-submit]
  workflow_dispatch:
    inputs:
      upload:
        description: Also upload them to App Store Connect (version 1.0)
        type: boolean
        default: false
      submit:
        description: Then fill in the store page and submit 1.0 for App Review
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      CLEAN_CERTS_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Start the Firebase emulators with sample data
        run: |
          npm install -g firebase-tools@13.35.1 >/dev/null
          mkdir -p /tmp/fb && cp firebase/firestore.rules /tmp/fb/
          cat > /tmp/fb/firebase.json <<'JSON'
          { "firestore": { "rules": "firestore.rules" },
            "emulators": { "auth": { "port": 9099, "host": "127.0.0.1" }, "firestore": { "port": 8085, "host": "127.0.0.1" }, "ui": { "enabled": false } } }
          JSON
          (cd /tmp/fb && nohup firebase emulators:start --only auth,firestore --project dungeon-descent-fbaf2 > /tmp/fb/emu.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:9099/ && curl -s -o /dev/null http://127.0.0.1:8085/ && break; sleep 2; done
          OUT=$(node tools/chat-screenshot-seed.mjs)
          echo "$OUT"
          set -- $OUT
          echo "SHOT_EMAIL=$1" >> "$GITHUB_ENV"; echo "SHOT_PASSWORD=$2" >> "$GITHUB_ENV"; echo "SHOT_DM=$4" >> "$GITHUB_ENV"

      - name: Build the chat app for the simulator (Debug)
        working-directory: swift/Chat
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild -project DungeonDescentChat.xcodeproj -scheme DungeonDescentChat -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_ENTITLEMENTS= \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Take the screenshots
        run: |
          APP=swift/Chat/build/Build/Products/Debug-iphonesimulator/DungeonDescentChat.app
          pick() { xcrun simctl list devices available -j | KIND="$1" python3 -c '
          import json, os, re, sys
          d = json.load(sys.stdin)["devices"]
          kind = os.environ["KIND"]
          def ver(k):
              m = re.search(r"iOS-(\d+)-(\d+)", k); return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for rt in sorted((k for k in d if "iOS" in k), key=ver, reverse=True):
              devs = [x for x in d[rt] if kind in x["name"]]
              if devs: print(devs[-1]["udid"]); break
          '; }
          shoot() { # device-folder udid
            OUT="shots/$1"; U="$2"; mkdir -p "$OUT"
            xcrun simctl boot "$U" || true
            xcrun simctl bootstatus "$U" -b
            xcrun simctl ui "$U" appearance dark
            xcrun simctl status_bar "$U" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode active --cellularBars 4 || true
            xcrun simctl install "$U" "$APP"
            BASE="-useEmulator -signInEmail $SHOT_EMAIL -signInPassword $SHOT_PASSWORD"
            first=1
            while read -r NAME ARGS; do
              xcrun simctl terminate "$U" com.dungeon.descent.chat 2>/dev/null || true
              xcrun simctl launch "$U" com.dungeon.descent.chat $BASE $ARGS
              if [ $first = 1 ]; then sleep 30; first=0; else sleep 14; fi
              xcrun simctl io "$U" screenshot "$OUT/$NAME.png"
              echo "$1: $NAME"
            done <<LIST
          01-general -startTab 0 -openRoom channel:general
          02-channels -startTab 0
          03-activity -startTab 2
          04-community -startTab 3
          05-messages -startTab 1
          06-group -startTab 1 -openRoom group:raidnight
          07-profile -startTab 4
          08-hall-of-legends -startTab 0 -openRoom channel:hall-of-legends
          LIST
            xcrun simctl spawn "$U" log show --last 20m --style compact --predicate 'process == "DungeonDescentChat"' 2>/dev/null | tail -200 > "$OUT/app-log.txt" || true
            xcrun simctl shutdown "$U" || true
          }
          shoot iphone "$(pick 'Pro Max')"
          shoot ipad "$(pick 'iPad Pro 13')"
          ls -la shots/*

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: chat-screenshots, path: shots, if-no-files-found: ignore }

      - name: Save to the chat-screenshots-results branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          git config user.name "Chat screenshots"; git config user.email "actions@users.noreply.github.com"
          WT=$(mktemp -d)
          git worktree add --detach "$WT"
          cd "$WT" && git checkout -q --orphan chat-screenshots-results && git rm -rqf . || true
          cp -r "$GITHUB_WORKSPACE/shots/." "$WT/"
          git add -A && git commit -qm "Chat screenshots ${GITHUB_SHA::7}" && git push -f origin chat-screenshots-results

      - name: Get key files from ios-certificates
        if: inputs.upload || inputs.submit || github.ref_name == 'chat-screenshots-upload' || github.ref_name == 'chat-submit'
        continue-on-error: true
        uses: actions/checkout@v4
        with: { repository: belgarath534/ios-certificates, token: '${{ env.CLEAN_CERTS_TOKEN }}', path: .certs-repo }

      - name: Upload to App Store Connect
        if: inputs.upload || inputs.submit || github.ref_name == 'chat-screenshots-upload' || github.ref_name == 'chat-submit'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.asc/candidates"
          [ -d .certs-repo ] && find .certs-repo -name '*.p8' -not -path '*/.git/*' -exec cp {} "$HOME/.asc/candidates/" \;
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then printf '%s\n' "$ASC_KEY_P8" > "$HOME/.asc/candidates/secret_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"; fi
          rm -rf .certs-repo
          ruby scripts/check_asc_key.rb
          . "$GITHUB_ENV" 2>/dev/null || true
          KEYPATH=$(grep '^ASC_KEY_PATH=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)
          KEYID=$(grep '^GOOD_KEY_ID=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)
          python3 -m venv /tmp/venv && . /tmp/venv/bin/activate
          pip install --quiet pyjwt cryptography requests
          # JPEG: no transparency channel (App Store Connect can refuse PNGs with one).
          for D in iphone ipad; do mkdir -p "up/$D"; for F in shots/$D/*.png; do sips -s format jpeg -s formatOptions 92 "$F" --out "up/$D/$(basename "${F%.png}").jpg" >/dev/null; done; done
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$KEYPATH" APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID" APP_STORE_CONNECT_KEY_IDENTIFIER="$KEYID"
          export BUNDLE=com.dungeon.descent.chat VERSION=1.0 PLATFORM=IOS
          DISPLAY_TYPE=APP_IPHONE_67 SHOTS_DIR=up/iphone python3 store/upload_screenshots.py
          DISPLAY_TYPE=APP_IPAD_PRO_3GEN_129 SHOTS_DIR=up/ipad python3 store/upload_screenshots.py
          echo "KEYPATH=$KEYPATH" >> "$GITHUB_ENV"; echo "KEYID=$KEYID" >> "$GITHUB_ENV"

      - name: Fill in the store page and submit for App Review
        if: inputs.submit || github.ref_name == 'chat-submit'
        env:
          CHAT_REVIEW_EMAIL: ${{ secrets.CHAT_REVIEW_EMAIL }}
          CHAT_REVIEW_PASSWORD: ${{ secrets.CHAT_REVIEW_PASSWORD }}
        run: |
          . /tmp/venv/bin/activate
          export ASC_KEY_PATH="$KEYPATH" GOOD_KEY_ID="$KEYID"
          python3 tools/chat-store.py
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$KEYPATH" APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID" APP_STORE_CONNECT_KEY_IDENTIFIER="$KEYID"
          BUNDLE=com.dungeon.descent.chat VERSION=1.0 PLATFORM=IOS SUBMIT=yes python3 store/submit_version.py

      - name: Remove keys
        if: always()
        run: rm -rf "$HOME/.asc"
