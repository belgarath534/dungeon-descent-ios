# Checks that the Swift version builds for iPhone on every push.
# It builds without signing, so it can't be installed; Codemagic does the
# signed TestFlight build. If this fails, the log says exactly why.
name: Swift iOS build

on:
  push:
    branches: [swift-rewrite]
    paths:
      - 'swift/**'
      - '.github/workflows/swift-build.yml'
  workflow_dispatch:

concurrency:
  group: swift-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The same Xcode 27 image as the TestFlight builds.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run the game rules tests
        working-directory: swift/DungeonCore
        run: swift test

      - name: Generate the Xcode project
        working-directory: swift/App
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Build the app for iPhone (unsigned)
        working-directory: swift/App
        run: |
          set -o pipefail
          xcodebuild \
            -project DungeonDescent.xcodeproj \
            -scheme DungeonDescent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Package unsigned IPA
        working-directory: swift/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DungeonDescent.app Payload/
          # The Apple Watch app rides inside the iPhone app.
          ls Payload/DungeonDescent.app/Watch/DungeonWatch.app/DungeonWatch
          # Every library the app loads at launch (@rpath) must be inside it,
          # or iOS can't start the app (12.0's first TestFlight crashed at launch).
          app=Payload/DungeonDescent.app
          echo "Frameworks in the app:"; ls "$app/Frameworks" 2>/dev/null || echo "(none)"
          missing=0
          for lib in $(otool -L "$app/DungeonDescent" | awk '/@rpath\//{print $1}'); do
            name=${lib#@rpath/}
            if [ -e "$app/Frameworks/$name" ]; then echo "ok  $name"; else echo "MISSING  $name"; missing=1; fi
          done
          [ $missing = 0 ] || { echo "::error::A library the app needs at launch isn't inside it"; exit 1; }
          zip -qr DungeonDescent-unsigned.ipa Payload

      - name: Build the app for Mac (unsigned)
        working-directory: swift/App
        run: |
          set -o pipefail
          xcodebuild \
            -project DungeonDescent.xcodeproj \
            -scheme DungeonDescent \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build-mac \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild-mac.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild-mac.log

      - name: Build the app for Apple Vision Pro (unsigned)
        working-directory: swift/App
        run: |
          set -o pipefail
          xcodebuild -showsdks | grep -qi xros || xcodebuild -downloadPlatform visionOS
          # Firestore's ready-made library has no Vision Pro version; this
          # builds it from source (Vision Pro only, so iPhone builds stay fast).
          export FIREBASE_SOURCE_FIRESTORE=1
          xcodebuild \
            -project DungeonDescent.xcodeproj \
            -scheme DungeonDescent \
            -configuration Release \
            -destination 'generic/platform=visionOS' \
            -derivedDataPath build-vision \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild-vision.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild-vision.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swift-ios-build
          path: |
            swift/App/DungeonDescent-unsigned.ipa
            swift/App/xcodebuild.log
            swift/App/xcodebuild-vision.log
            swift/App/xcodebuild-mac.log
          if-no-files-found: ignore
