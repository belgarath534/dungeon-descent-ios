# Tests firebase/firestore.rules in the Firestore emulator, then publishes them
# to both Firestore databases ((default) and dungeon-descent). Run it by pushing
# to the firebase-rules branch. Publishing needs the FIREBASE_SERVICE_ACCOUNT
# secret (a service account key JSON from Firebase, Project settings, Service
# accounts); without it, only the tests run.
name: Firebase rules
on:
  push:
    branches: [firebase-rules]
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    env:
      PROJECT: dungeon-descent-fbaf2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test the rules in the emulator
        working-directory: firebase
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Show the Realtime Database rules (read only)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          [ -z "$SA" ] && exit 0
          pip install --quiet google-auth requests
          python3 - <<'EOF'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          creds = service_account.Credentials.from_service_account_info(json.loads(os.environ["SA"]), scopes=[
              "https://www.googleapis.com/auth/firebase.database", "https://www.googleapis.com/auth/userinfo.email"])
          r = AuthorizedSession(creds).get("https://dungeon-descent-fbaf2-default-rtdb.firebaseio.com/.settings/rules.json")
          print("status", r.status_code)
          print(r.text)
          EOF
      - name: Publish to both databases
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT isn't set, so the tested rules were not published."
            exit 0
          fi
          pip install --quiet google-auth requests
          python3 - <<'EOF'
          import json, os, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          p = os.environ["PROJECT"]
          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["SA"]), scopes=["https://www.googleapis.com/auth/cloud-platform"])
          s = AuthorizedSession(creds)
          base = "https://firebaserules.googleapis.com/v1/projects/" + p
          src = open("firebase/firestore.rules").read()
          r = s.post(base + "/rulesets", json={"source": {"files": [{"name": "firestore.rules", "content": src}]}})
          if r.status_code >= 300:
              print("Creating the ruleset failed:", r.status_code, r.text[:2000]); sys.exit(1)
          name = r.json()["name"]
          print("Ruleset", name.rsplit("/", 1)[-1])
          for rel in ["cloud.firestore", "cloud.firestore/dungeon-descent"]:
              full = "projects/%s/releases/%s" % (p, rel)
              r = s.patch(base + "/releases/" + rel, json={"release": {"name": full, "rulesetName": name}})
              print(rel, "->", r.status_code)
              if r.status_code >= 300:
                  print(r.text[:2000]); sys.exit(1)
          EOF
