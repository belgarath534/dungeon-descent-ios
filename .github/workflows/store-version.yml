# Makes the next App Store version for iPhone, Mac and Apple Vision Pro
# (tools/new-version.py). Run it by pushing to the "store-version" branch
# (git push origin swift-rewrite:store-version). Safe to run again. Then it
# picks each platform's newest processed build and fills in the App Review
# details (store/submit_version.py, without submitting), and puts the Game
# Center leaderboards and challenges with the iPhone version.
name: New App Store version

on:
  push:
    branches: [store-version]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      CLEAN_CERTS_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Get key files from ios-certificates
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: belgarath534/ios-certificates
          token: ${{ env.CLEAN_CERTS_TOKEN }}
          path: .certs-repo

      - name: Collect Apple API keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.asc/candidates"
          if [ -d .certs-repo ]; then
            find .certs-repo -name '*.p8' -not -path '*/.git/*' -exec cp {} "$HOME/.asc/candidates/" \;
          fi
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$HOME/.asc/candidates/secret_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"
          fi
          rm -rf .certs-repo

      - name: Find the key Apple accepts
        run: ruby scripts/check_asc_key.rb

      - name: Make the versions
        run: |
          pip install --quiet pyjwt cryptography requests
          python3 tools/new-version.py

      - name: Pick the builds (not submitted)
        env:
          VERSION: "11.9"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$ASC_KEY_PATH"
          export APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID"
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$GOOD_KEY_ID"
          status=0
          for P in IOS MAC_OS VISION_OS; do
            echo "== $P"
            PLATFORM=$P python3 store/submit_version.py || status=1
          done
          exit $status

      - name: Attach Game Center to the iPhone version
        if: always()
        run: python3 tools/attach-game-center.py

      - name: Remove keys
        if: always()
        run: rm -rf "$HOME/.asc"
