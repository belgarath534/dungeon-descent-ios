# Checks that Dungeon Descent Chat (swift/Chat) builds for iPhone, without
# signing, on every push that changes it. A red build means it doesn't
# compile; the "error:" lines say why.
name: Chat app build

on:
  push:
    branches: [claude/affectionate-heisenberg-tmog1v, chat-app]
    paths: ['swift/Chat/**', '.github/workflows/chat-build.yml']
  workflow_dispatch:

concurrency:
  group: chat-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Generate the Xcode project
        working-directory: swift/Chat
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Build for iPhone (unsigned)
        working-directory: swift/Chat
        run: |
          set -o pipefail
          xcodebuild \
            -project DungeonDescentChat.xcodeproj \
            -scheme DungeonDescentChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*(Sendable|actor)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-build-log
          path: swift/Chat/xcodebuild.log
          if-no-files-found: ignore
