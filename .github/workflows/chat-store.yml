# Fills in Dungeon Descent Chat's App Store page from store-chat/
# (tools/chat-store.py): subtitle, description, keywords, promotional text,
# category, age rating, content rights, free price and App Review details.
# Runs when store-chat/ or the script changes, or by hand (Run workflow).
# The demo account for App Review comes from the CHAT_REVIEW_EMAIL and
# CHAT_REVIEW_PASSWORD secrets. App Privacy is done on the website.
name: Chat app store page

on:
  push:
    branches: [chat-store, claude/affectionate-heisenberg-tmog1v]
    paths: ['store-chat/**', 'tools/chat-store.py', '.github/workflows/chat-store.yml']
  workflow_dispatch:

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      CLEAN_CERTS_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Get key files from ios-certificates
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: belgarath534/ios-certificates
          token: ${{ env.CLEAN_CERTS_TOKEN }}
          path: .certs-repo

      - name: Collect Apple API keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.asc/candidates"
          if [ -d .certs-repo ]; then
            find .certs-repo -name '*.p8' -not -path '*/.git/*' -exec cp {} "$HOME/.asc/candidates/" \;
          fi
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$HOME/.asc/candidates/secret_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"
          fi
          rm -rf .certs-repo

      - name: Find the key Apple accepts
        run: ruby scripts/check_asc_key.rb

      - name: Fill in the store page
        env:
          CHAT_REVIEW_EMAIL: ${{ secrets.CHAT_REVIEW_EMAIL }}
          CHAT_REVIEW_PASSWORD: ${{ secrets.CHAT_REVIEW_PASSWORD }}
        run: |
          pip install --quiet pyjwt cryptography requests
          python3 tools/chat-store.py

      - name: Remove keys
        if: always()
        run: rm -rf "$HOME/.asc"
