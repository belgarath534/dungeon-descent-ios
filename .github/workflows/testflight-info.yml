# Fills in TestFlight's Test Information and Beta App Review details, sets
# each newest build's "What to Test", and sends the newest builds to every
# external tester group and to Beta App Review (tools/testflight-info.py).
# Run it by pushing to the "testflight-info" branch, after a TestFlight upload.
name: TestFlight information

on:
  push:
    branches: [testflight-info]
  workflow_dispatch:

jobs:
  testflight-info:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      CLEAN_CERTS_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Get key files from ios-certificates
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: belgarath534/ios-certificates
          token: ${{ env.CLEAN_CERTS_TOKEN }}
          path: .certs-repo

      - name: Collect Apple API keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.asc/candidates"
          if [ -d .certs-repo ]; then
            find .certs-repo -name '*.p8' -not -path '*/.git/*' -exec cp {} "$HOME/.asc/candidates/" \;
          fi
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$HOME/.asc/candidates/secret_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"
          fi
          rm -rf .certs-repo

      - name: Find the key Apple accepts
        run: ruby scripts/check_asc_key.rb

      - name: Fill in TestFlight and send builds to testers
        run: |
          pip install --quiet pyjwt cryptography requests
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$ASC_KEY_PATH"
          export APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID"
          export APP_STORE_CONNECT_KEY_IDENTIFIER="$GOOD_KEY_ID"
          python3 tools/testflight-info.py

      - name: Remove keys
        if: always()
        run: rm -rf "$HOME/.asc"
