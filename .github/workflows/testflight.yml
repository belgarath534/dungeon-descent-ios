# Sends the Swift version to TestFlight for iPhone (with its Live Activity and
# Apple Watch app), Apple Vision Pro and Mac, from GitHub's free Mac runners, for when Codemagic minutes run
# out. The same setup as the truck and RPG games: fastlane match with the
# shared certificate in the private ios-certificates repo. Start it by hand:
# push the code to the "testflight" branch (git push origin swift-rewrite:testflight),
# or Actions, "TestFlight (GitHub)", Run workflow once this file is on the
# default branch. See docs/GITHUB_TESTFLIGHT.md.
name: TestFlight (GitHub)

on:
  push:
    branches: [testflight]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: TestFlight (${{ matrix.name }})
    # Apple wants apps built with the newest SDK: the Xcode 27 image.
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone and Apple Watch
            lane: ios beta
          - name: Apple Vision Pro
            lane: ios vision
          - name: Mac
            lane: mac beta
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      CERTS_REPO_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for name in MATCH_PASSWORD CERTS_REPO_TOKEN ASC_ISSUER_ID; do
            if [ -n "${!name}" ]; then echo "✅ $name is set"; else echo "❌ $name is missing"; missing=1; fi
          done
          CLEAN=$(printf '%s' "$CERTS_REPO_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN"
          echo "CLEAN_CERTS_TOKEN=$CLEAN" >> "$GITHUB_ENV"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLEAN" https://api.github.com/repos/belgarath534/ios-certificates)
          if [ "$CODE" = "200" ]; then echo "✅ Token can reach ios-certificates"; else echo "❌ Token can't reach ios-certificates (HTTP $CODE)"; missing=1; fi
          exit $missing

      - name: Get key files from ios-certificates
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: belgarath534/ios-certificates
          token: ${{ env.CLEAN_CERTS_TOKEN }}
          path: .certs-repo

      - name: Collect Apple API keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.asc/candidates"
          if [ -d .certs-repo ]; then
            find .certs-repo -name '*.p8' -not -path '*/.git/*' -exec cp {} "$HOME/.asc/candidates/" \;
          fi
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$HOME/.asc/candidates/secret_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"
          fi
          rm -rf .certs-repo
          echo "Keys found: $(ls "$HOME/.asc/candidates" | tr '\n' ' ')"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Find the key Apple accepts
        run: ruby scripts/check_asc_key.rb

      - name: Use Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run the game rules tests
        working-directory: swift/DungeonCore
        run: swift test

      - name: Generate the Xcode project
        working-directory: swift/App
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Build, sign and upload to TestFlight
        run: bundle exec fastlane ${{ matrix.lane }}

      - name: Remove keys
        if: always()
        run: rm -rf "$HOME/.asc"
