# One-time setup for Dungeon Descent Chat (swift/Chat): registers its bundle
# ID with Apple (Sign in with Apple and push notifications on), and registers
# it as an iOS app in the game's Firebase project, then prints its
# GoogleService-Info.plist (the same kind of file the game commits). Safe to
# run again: anything that already exists is left as it is.
#
# The App Store Connect app itself ("New App" on the website) can't be made
# from a tool: that one step is done by hand.
name: Chat app setup

on:
  push:
    branches: [chat-setup, claude/affectionate-heisenberg-tmog1v]
    paths: ['.github/workflows/chat-setup.yml']
  workflow_dispatch:

env:
  BUNDLE_ID: com.dungeon.descent.chat
  APP_NAME: Dungeon Descent Chat
  FIREBASE_PROJECT: dungeon-descent-fbaf2

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      CLEAN_CERTS_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Get key files from ios-certificates
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: belgarath534/ios-certificates
          token: ${{ env.CLEAN_CERTS_TOKEN }}
          path: .certs-repo

      - name: Collect Apple API keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.asc/candidates"
          if [ -d .certs-repo ]; then
            find .certs-repo -name '*.p8' -not -path '*/.git/*' -exec cp {} "$HOME/.asc/candidates/" \;
          fi
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then
            printf '%s\n' "$ASC_KEY_P8" > "$HOME/.asc/candidates/secret_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"
          fi
          rm -rf .certs-repo

      - name: Find the key Apple accepts
        run: ruby scripts/check_asc_key.rb

      - name: Register the bundle ID with Apple
        run: |
          pip install --quiet pyjwt cryptography requests google-auth
          python3 - <<'EOF'
          import os, sys, time, jwt, requests
          now = int(time.time())
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"].strip(), "iat": now, "exp": now + 900,
                            "aud": "appstoreconnect-v1"}, open(os.environ["ASC_KEY_PATH"]).read(),
                           algorithm="ES256", headers={"kid": os.environ["GOOD_KEY_ID"].strip(), "typ": "JWT"})
          S = requests.Session(); S.headers["Authorization"] = "Bearer " + tok
          API = "https://api.appstoreconnect.apple.com/v1"
          bid = os.environ["BUNDLE_ID"]
          found = S.get(API + "/bundleIds", params={"filter[identifier]": bid}).json().get("data", [])
          found = [b for b in found if b["attributes"]["identifier"] == bid]
          if found:
              b = found[0]; print("Bundle ID already registered:", bid)
          else:
              r = S.post(API + "/bundleIds", json={"data": {"type": "bundleIds", "attributes": {
                  "identifier": bid, "name": os.environ["APP_NAME"], "platform": "UNIVERSAL"}}})
              if r.status_code >= 300:
                  print("Registering failed:", r.status_code, r.text[:1500]); sys.exit(1)
              b = r.json()["data"]; print("Registered", bid)
          have = {c["attributes"]["capabilityType"] for c in
                  S.get(API + f"/bundleIds/{b['id']}/bundleIdCapabilities").json().get("data", [])}
          for cap, settings in (("APPLE_ID_AUTH", [{"key": "APPLE_ID_AUTH_APP_CONSENT", "options": [{"key": "PRIMARY_APP_CONSENT"}]}]),
                                ("PUSH_NOTIFICATIONS", None)):
              if cap in have:
                  print(cap, "already on"); continue
              attrs = {"capabilityType": cap}
              if settings: attrs["settings"] = settings
              r = S.post(API + "/bundleIdCapabilities", json={"data": {"type": "bundleIdCapabilities",
                  "attributes": attrs, "relationships": {"bundleId": {"data": {"type": "bundleIds", "id": b["id"]}}}}})
              print(cap, "->", r.status_code, "" if r.ok else r.text[:800])
          EOF

      - name: Register the app in Firebase and print its config
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'EOF'
          import base64, json, os, sys, time
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          if not os.environ.get("SA"):
              print("FIREBASE_SERVICE_ACCOUNT isn't set."); sys.exit(1)
          creds = service_account.Credentials.from_service_account_info(json.loads(os.environ["SA"]),
              scopes=["https://www.googleapis.com/auth/cloud-platform", "https://www.googleapis.com/auth/firebase"])
          s = AuthorizedSession(creds)
          base = "https://firebase.googleapis.com/v1beta1/projects/" + os.environ["FIREBASE_PROJECT"]
          bid = os.environ["BUNDLE_ID"]
          apps = s.get(base + "/iosApps").json().get("apps", [])
          print("iOS apps in Firebase:", [a.get("bundleId") for a in apps])
          app = next((a for a in apps if a.get("bundleId") == bid), None)
          if not app:
              r = s.post(base + "/iosApps", json={"bundleId": bid, "displayName": os.environ["APP_NAME"]})
              if r.status_code >= 300:
                  print("Registering failed:", r.status_code, r.text[:1500]); sys.exit(1)
              op = r.json()["name"]
              for _ in range(30):
                  o = s.get("https://firebase.googleapis.com/v1beta1/" + op).json()
                  if o.get("done"):
                      if "error" in o: print(o["error"]); sys.exit(1)
                      app = o["response"]; break
                  time.sleep(2)
              print("Registered", bid, "in Firebase:", app.get("appId"))
          else:
              print("Already in Firebase:", app.get("appId"))
          cfg = s.get(f"{base}/iosApps/{app['appId']}/config").json()
          plist = base64.b64decode(cfg["configFileContents"]).decode()
          os.makedirs("out", exist_ok=True)
          open("out/GoogleService-Info.plist", "w").write(plist)
          print("----- GoogleService-Info.plist -----")
          print(plist)
          print("----- end -----")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: chat-GoogleService-Info
          path: out/GoogleService-Info.plist
          if-no-files-found: ignore

      - name: Remove keys
        if: always()
        run: rm -rf "$HOME/.asc"
