# Uploads the screenshots already on the chat-screenshots-results branch
# (taken by "Chat app screenshots"), fills in DD Chat's store page and App
# Review details, and submits version 1.0 for App Review. Push to the
# chat-submit-now branch, or Run workflow.
name: Chat app submit

on:
  push:
    branches: [chat-submit-now]
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      CLEAN_CERTS_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: chat-screenshots-results, path: shots }

      - name: Get key files from ios-certificates
        continue-on-error: true
        uses: actions/checkout@v4
        with: { repository: belgarath534/ios-certificates, token: '${{ env.CLEAN_CERTS_TOKEN }}', path: .certs-repo }

      - name: Collect Apple API keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.asc/candidates"
          [ -d .certs-repo ] && find .certs-repo -name '*.p8' -not -path '*/.git/*' -exec cp {} "$HOME/.asc/candidates/" \;
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then printf '%s\n' "$ASC_KEY_P8" > "$HOME/.asc/candidates/secret_$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]').p8"; fi
          rm -rf .certs-repo

      - name: Find the key Apple accepts
        run: ruby scripts/check_asc_key.rb

      - name: Upload the screenshots
        run: |
          pip install --quiet pyjwt cryptography requests pillow
          # JPEG: no transparency channel (App Store Connect can refuse PNGs with one).
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for d in ("iphone", "ipad"):
              os.makedirs(f"up/{d}", exist_ok=True)
              for f in sorted(glob.glob(f"shots/{d}/*.png")):
                  Image.open(f).convert("RGB").save(f"up/{d}/" + os.path.basename(f)[:-4] + ".jpg", quality=92)
              print(d, len(os.listdir(f"up/{d}")), "screenshots")
          PY
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$ASC_KEY_PATH" APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID" APP_STORE_CONNECT_KEY_IDENTIFIER="$GOOD_KEY_ID"
          export BUNDLE=com.dungeon.descent.chat VERSION=1.0 PLATFORM=IOS
          DISPLAY_TYPE=APP_IPHONE_67 SHOTS_DIR=up/iphone python3 store/upload_screenshots.py
          DISPLAY_TYPE=APP_IPAD_PRO_3GEN_129 SHOTS_DIR=up/ipad python3 store/upload_screenshots.py

      - name: Fill in the store page and submit for App Review
        env:
          CHAT_REVIEW_EMAIL: ${{ secrets.CHAT_REVIEW_EMAIL }}
          CHAT_REVIEW_PASSWORD: ${{ secrets.CHAT_REVIEW_PASSWORD }}
        run: |
          python3 tools/chat-store.py
          export APP_STORE_CONNECT_PRIVATE_KEY="@file:$ASC_KEY_PATH" APP_STORE_CONNECT_ISSUER_ID="$ASC_ISSUER_ID" APP_STORE_CONNECT_KEY_IDENTIFIER="$GOOD_KEY_ID"
          BUNDLE=com.dungeon.descent.chat VERSION=1.0 PLATFORM=IOS SUBMIT=yes python3 store/submit_version.py

      - name: Remove keys
        if: always()
        run: rm -rf "$HOME/.asc"
