name: Build iOS (unsigned)

on:
  push:
    branches:
      - claude/github-actions-ios-build
  workflow_dispatch: {}

jobs:
  build:
    name: Dungeon Descent iOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        # Matches codemagic.yaml's `xcode: latest`. Unlike Puzzle Master, this
        # project uses CocoaPods (ios/App/Podfile), not Swift Package Manager,
        # so it shouldn't hit the "mixed language source files" SPM restriction
        # that broke Puzzle Master's build under modern Xcode.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 2 -name "*.app" | head -1)
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r App.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: dungeon-descent-unsigned-ipa
          path: build/ios/ipa/App.ipa
          retention-days: 14
