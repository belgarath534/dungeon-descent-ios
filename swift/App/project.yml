# XcodeGen spec for the Swift version of Dungeon Descent.
# Codemagic turns this into DungeonDescent.xcodeproj with `xcodegen generate`,
# so the project file itself never has to be edited by hand or committed.
#
# Same bundle ID, version and entitlements as the web version's app, so it
# installs over it on TestFlight and signs with the same profiles.
name: DungeonDescent
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # English is the source; Localizable.xcstrings holds the Portuguese.
  developmentLanguage: en
# One version for the app and its Live Activity extension (the App Store
# requires them to match); Codemagic bumps CURRENT_PROJECT_VERSION here.
settings:
  base:
    MARKETING_VERSION: "11.7.3"
    CURRENT_PROJECT_VERSION: "1"
packages:
  DungeonCore:
    path: ../DungeonCore
  # The web version's Firebase project (accounts, cloud saves and the online
  # features), through Google's own iOS libraries.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  DungeonDescent:
    type: application
    platform: iOS
    sources:
      - path: DungeonDescent
      - path: Shared
      # The web version's audio files, used as-is (one copy in the repo).
      - path: ../../www/audio
        type: folder
        buildPhase: resources
    dependencies:
      - package: DungeonCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseDatabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: DDLiveActivity
    scheme: {}
    info:
      path: DungeonDescent/Info.plist
      properties:
        CFBundleDisplayName: Dungeon Descent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        # Lets iPhone Settings → Dungeon Descent → Language offer Portuguese.
        CFBundleLocalizations: [en, pt-BR]
        LSApplicationCategoryType: public.app-category.role-playing-games
        GCSupportsGameMode: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIBackgroundModes:
          - audio
        # Endless Descent's run on the Lock Screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        # The Command Center's mic.
        NSMicrophoneUsageDescription: Dungeon Descent listens for a spoken command when you tap the mic in the Command Center.
        NSSpeechRecognitionUsageDescription: Dungeon Descent turns your spoken command into text in the Command Center.
        CFBundleURLTypes:
          - CFBundleURLName: com.dungeon.descent
            CFBundleURLSchemes:
              - dungeondescent
          # Google sign-in returns here (REVERSED_CLIENT_ID in GoogleService-Info.plist).
          - CFBundleURLName: google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.109323203666-sj667ngkft9jr7h85c5338bvllhl3hoq
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The web version's Google fonts (OFL), bundled.
        UIAppFonts:
          - Cinzel-Variable.ttf
          - CinzelDecorative-Regular.ttf
          - CinzelDecorative-Bold.ttf
          - CinzelDecorative-Black.ttf
          - CrimsonText-Regular.ttf
          - CrimsonText-Italic.ttf
          - CrimsonText-SemiBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: DungeonDescent/DungeonDescent.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.dungeon.descent
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dungeon.descent
        PRODUCT_NAME: DungeonDescent
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
  # The Live Activity, same bundle ID and App Store profile as the web
  # version's DDLiveActivity extension.
  DDLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: DDLiveActivity
      - path: Shared
    info:
      path: DDLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Dungeon Descent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dungeon.descent.DDLiveActivity
        PRODUCT_NAME: DDLiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
