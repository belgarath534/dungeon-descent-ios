# XcodeGen spec for the Swift version of Dungeon Descent.
# Codemagic turns this into DungeonDescent.xcodeproj with `xcodegen generate`,
# so the project file itself never has to be edited by hand or committed.
#
# Same bundle ID, version and entitlements as the web version's app, so it
# installs over it on TestFlight and signs with the same profiles.
name: DungeonDescent
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  DungeonCore:
    path: ../DungeonCore
targets:
  DungeonDescent:
    type: application
    platform: iOS
    sources:
      - path: DungeonDescent
      # The web version's audio files, used as-is (one copy in the repo).
      - path: ../../www/audio
        type: folder
        buildPhase: resources
    dependencies:
      - package: DungeonCore
    scheme: {}
    info:
      path: DungeonDescent/Info.plist
      properties:
        CFBundleDisplayName: Dungeon Descent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.role-playing-games
        GCSupportsGameMode: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The web version's Google fonts (OFL), bundled.
        UIAppFonts:
          - Cinzel-Variable.ttf
          - CinzelDecorative-Regular.ttf
          - CinzelDecorative-Bold.ttf
          - CinzelDecorative-Black.ttf
          - CrimsonText-Regular.ttf
          - CrimsonText-Italic.ttf
          - CrimsonText-SemiBold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: DungeonDescent/DungeonDescent.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.dungeon.descent
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dungeon.descent
        PRODUCT_NAME: DungeonDescent
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
