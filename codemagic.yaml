workflows:
  ionic-capacitor-ios-workflow:
    name: Dungeon Descent iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: v20.14.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Capacitor sync
        script: |
          npx cap sync ios
      - name: Build unsigned .app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData/Build/Products" -maxdepth 2 -name "*.app" | head -1)
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r App.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  dungeon-descent-appstore:
    name: Dungeon Descent App Store
    # Paid pay-as-you-go Mac: starts right away instead of waiting in the free line.
    # The 60 minute cap keeps a stuck build from costing much.
    max_build_duration: 60
    instance_type: mac_mini_m4
    integrations:
      app_store_connect: Accessible Backrooms
    environment:
      ios_signing:
        # The main app's profile is downloaded fresh from Apple in the
        # "Get the App Store profile from Apple" step below, so a stale copy
        # saved in Codemagic can't sneak in without iCloud.
        provisioning_profiles:
          - Dungeon Descent Live Activity App Store
        certificates:
          - Accessible Backrooms Distribution
      node: v20.14.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
          # The iPhone version launches without ads or coin purchases (Android keeps both).
          # Leaving the plugins out means the coin shop hides those buttons by itself.
          npm uninstall @capacitor-community/admob cordova-plugin-purchase --legacy-peer-deps
      - name: Capacitor sync
        script: |
          npx cap sync ios
      - name: Get the App Store profile from Apple
        script: |
          # Uses the App Store Connect key from the integration above.
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          for NAME in "Dungeon Descent iCloud App Store" "Dungeon Descent App Store"; do
            TMP=$(mktemp -d)
            app-store-connect profiles list --type IOS_APP_STORE --state ACTIVE \
              --name "$NAME" --save --profiles-dir "$TMP" || true
            for F in "$TMP"/*; do
              [ -f "$F" ] || continue
              if security cms -D -i "$F" | grep -q "iCloud.com.dungeon.descent"; then
                echo "Using \"$NAME\" from Apple, it includes iCloud"
                cp "$F" "$DEST/"
                exit 0
              fi
              echo "\"$NAME\" on Apple does not include iCloud, skipping it"
            done
          done
          echo "No active App Store profile with iCloud for com.dungeon.descent was found on Apple"
          exit 1
      - name: Use the App Store signing profiles
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" ios/App/App.xcodeproj/project.pbxproj
          grep -m1 CURRENT_PROJECT_VERSION ios/App/App.xcodeproj/project.pbxproj
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false  # internal testers get every build anyway; true tries external beta review and fails without Test Information

  dungeon-descent-swift:
    name: Dungeon Descent Swift (TestFlight)
    # The Swift rewrite in swift/. Same bundle ID as the web version, so each
    # build replaces it on TestFlight. Start it by hand from Codemagic.
    max_build_duration: 60
    instance_type: mac_mini_m4
    integrations:
      app_store_connect: Accessible Backrooms
    environment:
      ios_signing:
        provisioning_profiles:
          - Dungeon Descent Live Activity App Store
        certificates:
          - Accessible Backrooms Distribution
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Run the game rules tests
        script: |
          cd swift/DungeonCore
          swift test
      - name: Get the App Store profile from Apple
        script: |
          # The app needs a profile with iCloud and Push Notifications (Live
          # Activity updates while the app is closed). The first build turns
          # Push Notifications on for com.dungeon.descent and makes the profile
          # with the App Store Connect integration's key; later builds reuse it.
          set -e
          ID=com.dungeon.descent
          NAME="Dungeon Descent Push App Store"
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          fetch() {
            TMP=$(mktemp -d)
            app-store-connect profiles list --type IOS_APP_STORE --state ACTIVE \
              --name "$NAME" --save --profiles-dir "$TMP" >/dev/null 2>&1 || true
            for F in "$TMP"/*; do
              [ -f "$F" ] || continue
              if security cms -D -i "$F" | grep -q "iCloud.com.dungeon.descent" && \
                 security cms -D -i "$F" | grep -q "aps-environment"; then
                cp "$F" "$DEST/"; return 0
              fi
            done
            return 1
          }
          if fetch; then echo "Using \"$NAME\" from Apple"; exit 0; fi
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$ID" --strict-match-identifier --json \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["id"] if d else "")')
          [ -n "$BID" ] || { echo "No bundle ID $ID on Apple"; exit 1; }
          echo "Turning on Push Notifications for $ID"
          app-store-connect bundle-ids enable-capabilities "$BID" --capability "Push Notifications" || true
          CERTS=""
          for T in DISTRIBUTION IOS_DISTRIBUTION; do
            C=$(app-store-connect certificates list --type $T --json 2>/dev/null \
              | python3 -c 'import sys,json; print(" ".join(c["id"] for c in json.load(sys.stdin)))' || true)
            CERTS="$CERTS $C"
          done
          [ -n "${CERTS// /}" ] || { echo "No distribution certificate found on Apple"; exit 1; }
          app-store-connect profiles create "$BID" --certificate-ids $CERTS \
            --type IOS_APP_STORE --name "$NAME" >/dev/null
          echo "Made \"$NAME\""
          fetch || { echo "Made the profile but it is missing iCloud or push; check the App ID on Apple"; exit 1; }
      - name: Get the Apple Watch app's profile from Apple
        script: |
          # The watch app (com.dungeon.descent.watchkitapp) needs its own App
          # Store profile. The first build makes it with the App Store Connect
          # integration's key: the bundle ID, then a profile with the team's
          # distribution certificates. Later builds reuse it.
          set -e
          ID=com.dungeon.descent.watchkitapp
          NAME="Dungeon Descent Watch App Store"
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          fetch() {
            TMP=$(mktemp -d)
            app-store-connect profiles list --type IOS_APP_STORE --state ACTIVE \
              --name "$NAME" --save --profiles-dir "$TMP" >/dev/null 2>&1 || true
            if ls "$TMP"/* >/dev/null 2>&1; then cp "$TMP"/* "$DEST/"; return 0; fi
            return 1
          }
          if fetch; then echo "Using \"$NAME\" from Apple"; exit 0; fi
          echo "No \"$NAME\" yet. Making it."
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$ID" --strict-match-identifier --json 2>/dev/null \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["id"] if d else "")' || true)
          if [ -z "$BID" ]; then
            BID=$(app-store-connect bundle-ids create "$ID" --name "Dungeon Descent Watch" --platform IOS --json \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); print((d[0] if isinstance(d,list) else d)["id"])')
            echo "Registered $ID"
          fi
          CERTS=""
          for T in DISTRIBUTION IOS_DISTRIBUTION; do
            C=$(app-store-connect certificates list --type $T --json 2>/dev/null \
              | python3 -c 'import sys,json; print(" ".join(c["id"] for c in json.load(sys.stdin)))' || true)
            CERTS="$CERTS $C"
          done
          if [ -z "${CERTS// /}" ]; then echo "No distribution certificate found on Apple"; exit 1; fi
          app-store-connect profiles create "$BID" --certificate-ids $CERTS \
            --type IOS_APP_STORE --name "$NAME" >/dev/null
          echo "Made \"$NAME\""
          fetch || { echo "Made the profile but couldn't download it"; exit 1; }
      - name: Set build number
        script: |
          # TestFlight only accepts a build number higher than every earlier
          # one, including the web version's builds from the other workflow.
          # Ask Apple for the latest; if that fails, the project-wide build
          # count is still higher than any number Codemagic has used before.
          APP_ID=$(app-store-connect apps list --bundle-id-identifier com.dungeon.descent \
            --strict-match-identifier --json 2>/dev/null \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["id"] if d else "")' || true)
          LATEST=0
          if [ -n "$APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null \
              | grep -Eo '^[0-9]+$' | tail -1 || true)
          fi
          NEXT=$(( ${LATEST:-0} + 1 ))
          if [ "${PROJECT_BUILD_NUMBER:-0}" -gt "$NEXT" ]; then NEXT=$PROJECT_BUILD_NUMBER; fi
          echo "Latest on TestFlight: ${LATEST:-unknown}. Using build number $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$NEXT\"/" swift/App/project.yml
          grep CURRENT_PROJECT_VERSION swift/App/project.yml
      - name: Generate the Xcode project
        script: |
          cd swift/App
          xcodegen generate
      - name: Use the App Store signing profiles
        script: |
          xcode-project use-profiles --project swift/App/DungeonDescent.xcodeproj
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project swift/App/DungeonDescent.xcodeproj \
            --scheme DungeonDescent
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false  # internal testers get every build anyway

  dungeon-descent-vision:
    name: Dungeon Descent Vision Pro (TestFlight)
    # The native Apple Vision Pro build of the Swift app (same app, visionOS
    # platform in App Store Connect). Start it by hand from Codemagic.
    # The Swift rewrite in swift/. Same bundle ID as the web version, so each
    # build replaces it on TestFlight. Start it by hand from Codemagic.
    max_build_duration: 120
    instance_type: mac_mini_m4
    integrations:
      app_store_connect: Accessible Backrooms
    environment:
      ios_signing:
        provisioning_profiles:
          - Dungeon Descent Live Activity App Store
        certificates:
          - Accessible Backrooms Distribution
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Run the game rules tests
        script: |
          cd swift/DungeonCore
          swift test
      - name: Get the App Store profile from Apple
        script: |
          # The app needs a profile with iCloud and Push Notifications (Live
          # Activity updates while the app is closed). The first build turns
          # Push Notifications on for com.dungeon.descent and makes the profile
          # with the App Store Connect integration's key; later builds reuse it.
          set -e
          ID=com.dungeon.descent
          NAME="Dungeon Descent Push App Store"
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          fetch() {
            TMP=$(mktemp -d)
            app-store-connect profiles list --type IOS_APP_STORE --state ACTIVE \
              --name "$NAME" --save --profiles-dir "$TMP" >/dev/null 2>&1 || true
            for F in "$TMP"/*; do
              [ -f "$F" ] || continue
              if security cms -D -i "$F" | grep -q "iCloud.com.dungeon.descent" && \
                 security cms -D -i "$F" | grep -q "aps-environment"; then
                cp "$F" "$DEST/"; return 0
              fi
            done
            return 1
          }
          if fetch; then echo "Using \"$NAME\" from Apple"; exit 0; fi
          BID=$(app-store-connect bundle-ids list --bundle-id-identifier "$ID" --strict-match-identifier --json \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["id"] if d else "")')
          [ -n "$BID" ] || { echo "No bundle ID $ID on Apple"; exit 1; }
          echo "Turning on Push Notifications for $ID"
          app-store-connect bundle-ids enable-capabilities "$BID" --capability "Push Notifications" || true
          CERTS=""
          for T in DISTRIBUTION IOS_DISTRIBUTION; do
            C=$(app-store-connect certificates list --type $T --json 2>/dev/null \
              | python3 -c 'import sys,json; print(" ".join(c["id"] for c in json.load(sys.stdin)))' || true)
            CERTS="$CERTS $C"
          done
          [ -n "${CERTS// /}" ] || { echo "No distribution certificate found on Apple"; exit 1; }
          app-store-connect profiles create "$BID" --certificate-ids $CERTS \
            --type IOS_APP_STORE --name "$NAME" >/dev/null
          echo "Made \"$NAME\""
          fetch || { echo "Made the profile but it is missing iCloud or push; check the App ID on Apple"; exit 1; }
      - name: Set build number
        script: |
          # TestFlight only accepts a build number higher than every earlier
          # one, including the web version's builds from the other workflow.
          # Ask Apple for the latest; if that fails, the project-wide build
          # count is still higher than any number Codemagic has used before.
          APP_ID=$(app-store-connect apps list --bundle-id-identifier com.dungeon.descent \
            --strict-match-identifier --json 2>/dev/null \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d[0]["id"] if d else "")' || true)
          LATEST=0
          if [ -n "$APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null \
              | grep -Eo '^[0-9]+$' | tail -1 || true)
          fi
          NEXT=$(( ${LATEST:-0} + 1 ))
          if [ "${PROJECT_BUILD_NUMBER:-0}" -gt "$NEXT" ]; then NEXT=$PROJECT_BUILD_NUMBER; fi
          echo "Latest on TestFlight: ${LATEST:-unknown}. Using build number $NEXT"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"[0-9]*\"/CURRENT_PROJECT_VERSION: \"$NEXT\"/" swift/App/project.yml
          grep CURRENT_PROJECT_VERSION swift/App/project.yml
      - name: Generate the Xcode project
        script: |
          cd swift/App
          xcodegen generate
      - name: Use the App Store signing profiles
        script: |
          xcode-project use-profiles --project swift/App/DungeonDescent.xcodeproj
      - name: Build signed Vision Pro app
        script: |
          # Firestore has no ready-made Vision Pro library; build it from source.
          export FIREBASE_SOURCE_FIRESTORE=1
          xcode-project build-ipa \
            --project swift/App/DungeonDescent.xcodeproj \
            --scheme DungeonDescent \
            --archive-flags="-destination 'generic/platform=visionOS'"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false  # internal testers get every build anyway

  store-listing:
    name: App Store listing text (iPhone, Mac, Vision Pro)
    # Puts store/en-US/*.txt (description, promotional text, What's New,
    # keywords) into every Dungeon Descent version waiting for submission in
    # App Store Connect, on every platform. Start it by hand from Codemagic.
    max_build_duration: 15
    instance_type: mac_mini_m4
    integrations:
      app_store_connect: Accessible Backrooms
    scripts:
      - name: Fill in the listing
        script: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          def asc(*args):
              r = subprocess.run(["app-store-connect", *args, "--json"], capture_output=True, text=True)
              if r.returncode != 0:
                  raise RuntimeError(r.stderr.strip() or r.stdout.strip())
              return json.loads(r.stdout or "null")
          text = {k: open(f"store/en-US/{k}.txt").read().strip()
                  for k in ("description", "promotional_text", "whats_new", "keywords")}
          apps = asc("apps", "list", "--bundle-id-identifier", "com.dungeon.descent", "--strict-match-identifier")
          app_id = apps[0]["id"]
          every = asc("apps", "app-store-versions", app_id) or []
          print("All versions:")
          for v in every:
              print("  ", v["attributes"].get("platform"), v["attributes"].get("versionString"), v["attributes"].get("appStoreState") or v["attributes"].get("appVersionState"))
          editable = {"PREPARE_FOR_SUBMISSION", "DEVELOPER_REJECTED", "REJECTED", "METADATA_REJECTED"}
          versions = [v for v in every if (v["attributes"].get("appStoreState") or v["attributes"].get("appVersionState")) in editable]
          if not versions:
              print("No version is waiting for submission."); sys.exit(1)
          failed = False
          for v in versions:
              a = v["attributes"]
              name = f'{a.get("platform")} {a.get("versionString")}'
              locs = asc("app-store-versions", "localizations", v["id"], "--locale", "en-US")
              if not locs:
                  print(f"{name}: no en-US listing, skipped"); continue
              lid = locs[0]["id"]
              cur = locs[0].get("attributes", {})
              if os.environ.get("MODE") == "read":
                  print(f"===== {name} =====")
                  for k in ("promotionalText", "description", "whatsNew", "keywords"):
                      print(f"--- {k} ---"); print(cur.get(k) or "(empty)")
                  continue
              try:
                  asc("app-store-version-localizations", "modify", lid,
                      "--description", text["description"],
                      "--promotional-text", text["promotional_text"],
                      "--keywords", text["keywords"])
                  print(f"{name}: description, promotional text and keywords set")
              except RuntimeError as e:
                  failed = True; print(f"{name}: couldn't set the listing: {e}")
              try:
                  asc("app-store-version-localizations", "modify", lid, "--whats-new", text["whats_new"])
                  print(f"{name}: What's New set")
              except RuntimeError as e:
                  # A platform's first version has no What's New.
                  print(f"{name}: What's New not set (normal for a platform's first version): {e}")
          sys.exit(1 if failed else 0)
          PY
