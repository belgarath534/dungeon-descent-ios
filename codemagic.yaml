workflows:
  ionic-capacitor-ios-workflow:
    name: Dungeon Descent iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: v20.14.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Capacitor sync
        script: |
          npx cap sync ios
      - name: Build unsigned IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App \
            --config Debug
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
